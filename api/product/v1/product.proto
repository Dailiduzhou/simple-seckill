syntax = "proto3";

package api.product.v1;

import "google/api/annotations.proto";

option go_package = "seckill/api/product/v1;v1";
option java_multiple_files = true;
option java_package = "api.product.v1";

service Product {
  rpc Seckill(SeckillReq) returns (SeckillResp) {
    option (google.api.http) = {
      post: "/api/seckill"
      body: "*"
    };
  }
  rpc GetSeckillStatus(GetSeckillStatusReq) returns (GetSeckillStatusResp) {
    option (google.api.http) = {
      post: "/api/seckill/status"
      body: "*"
    };
  }
  rpc DeductStockSaga(DeductStockSagaReq) returns (DeductStockSagaResp) {
    option (google.api.http) = {
      post: "/api/seckill/saga/deductStock"
      body: "*"
    };
  }
  rpc RestoreStock(RestoreStockReq) returns (RestoreStockResp);

  rpc GetProduct(GetProductReq) returns (GetProductResp) {
    option (google.api.http) = {
      post: "/api/product"
      body: "*"
    };
  }
}

enum Result {
  SUCCESS = 0;
  FAILURE = 1;
  QUEUED = 2;
}

enum SeckillStatus {
  SECKILL_STATUS_WAITING = 0;
  SECKILL_STATUS_PROCESSING = 1;
  SECKILL_STATUS_SUCCESS = 2;
  SECKILL_STATUS_SOLD_OUT = 3;
  SECKILL_STATUS_DEGRADED = 4;
  SECKILL_STATUS_FAILED = 5;
}

message SeckillReq {
  int64 userID = 1;
}
message SeckillResp {
  Result res = 1;
  string requestID = 2;
}

message GetSeckillStatusReq {
  string requestID = 1;
}

message GetSeckillStatusResp {
  SeckillStatus status = 1;
  string reason = 2;
  int64 userID = 3;
  int64 productID = 4;
}

message DeductStockSagaReq {
  int64 productID = 1;
  int32 amount = 2;
}
message DeductStockSagaResp {
  bool success = 1;
}
message RestoreStockReq {
  int64 productID = 1;
  int32 amount = 2;
}
message RestoreStockResp {
  bool success = 1;
}

message GetProductReq {
  int64 productID = 1;
}

message GetProductResp {
  int64 productID = 1;
  int32 price = 2;
  int32 stock = 3;
}
